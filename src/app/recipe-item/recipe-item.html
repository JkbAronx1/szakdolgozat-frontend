<div class="recipe-card" (click)="kattintasTortent()">
  
  <div style="position: relative; margin: -20px -20px 15px -20px;">
    
    <img [src]="recipe.kepUrl || 'https://images.unsplash.com/photo-1495195134817-a165d429280b?w=600&q=80'" 
         style="width: 100%; height: 180px; object-fit: cover; border-radius: 20px 20px 0 0; display: block;" 
         alt="Recept képe">
         
    <div style="position: absolute; bottom: 10px; left: 10px; background: rgba(255, 255, 255, 0.95); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #2c3e50; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
      👤 {{recipe.author || 'Ismeretlen'}}
    </div>

  </div>
  
  <div class="card-content">
    <span class="badge">{{recipe.kategoria || 'Egyéb'}}</span>
    <h3>{{recipe.title}}</h3>
    
    <div class="recipe-stats">
      <div class="stat">
        <small>NEHÉZSÉG</small>
        <div class="stat-value">{{recipe.nehezseg || '-'}}</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <small>ELKÉSZÍTÉSI IDŐ</small>
        <div class="stat-value">{{recipe.ido ? recipe.ido + ' perc' : '-'}}</div>
      </div>
    </div>
  </div>

</div>
